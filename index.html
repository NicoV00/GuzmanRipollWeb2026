<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons en múltiplos de 48px (lo que recomienda Google para mostrar el logo en los resultados) -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#07111C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F2F2" media="(prefers-color-scheme: light)" />
    <!--seo:start (scripts/prerender.mjs reemplaza este bloque por ruta en el build) -->
    <title>Cirujano Plástico en Punta del Este, Uruguay | Dr. Guzmán Ripoll</title>
    <meta name="description" content="Cirugía plástica, estética y reconstructiva en Punta del Este y Maldonado, Uruguay. Aumento mamario, lipoescultura VASER y abdominoplastia con el Dr. Guzmán Ripoll." />
    <!--seo:end-->
    <meta name="google-site-verification" content="RvY5M7ekRhpXNQsQdF1vHQwbzjLiad-6tnyL8aFvlOU" />
    <meta property="og:site_name" content="Dr. Guzmán Ripoll" />
    <meta property="og:locale" content="es_UY" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- DNS prefetch para CDN externas usadas en el hero -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- Fuentes del hero: precarga para que el texto LCP pinte de inmediato -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Poppins/Poppins-Regular.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Poppins/Poppins-SemiBold.woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Archivo (solo se usa en el footer): carga sin bloquear el render -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
